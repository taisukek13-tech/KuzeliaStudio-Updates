name: Windows acceptance
'on':
  push:
    branches:
    - validation-v0.20.24-c1
    paths:
    - .github/workflows/windows-acceptance.yml
permissions:
  contents: read
jobs:
  observe:
    if: github.repository == 'taisukek13-tech/KuzeliaStudio-Updates' && github.ref == 'refs/heads/validation-v0.20.24-c1'
    strategy:
      fail-fast: false
      matrix:
        order:
        - A
        - B
        - duplicate
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      OBSERVATION_ORDER: ${{ matrix.order }}
      PROBE_SHA: a13639a4f2fd46475406c71ff3b7895f402ff6ebb3987d1045e5f4f24bb836ad
    steps:
    - name: Use official .NET runtime
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.403
    - name: Fetch both official versions and pin the binary-only diagnostic
      shell: pwsh
      run: |
        $ErrorActionPreference='Stop'
        $root=Join-Path $env:RUNNER_TEMP 'regular-close-study'
        $bin=Join-Path $root 'probe'; $report=Join-Path $root 'evidence'
        $null=New-Item -Path $bin,$report -ItemType Directory -Force
        $bundle=Join-Path $root 'probe.zip'
        & curl.exe --fail --silent --show-error --location --retry 2 --max-time 45 --output $bundle ('https://raw.githubusercontent.com/'+$env:GITHUB_REPOSITORY+'/'+$env:GITHUB_SHA+'/.github/workflows/kuzelia-close-probe-1.zip')
        if($LASTEXITCODE -ne 0 -or (Get-FileHash -LiteralPath $bundle).Hash -ne $env:PROBE_SHA){throw 'Unverified close diagnostic'}
        [IO.Compression.ZipFile]::ExtractToDirectory($bundle,$bin)
        $releases=@(@{v='0.20.23';sha='8da148f191f792de09f37b606ac00b55587059c012103f3c2d0e0f6fcb019d20';core='a7406c7f6fc0e5ecf1bc11ccb660f986bf240d6c8f07063ee4601245bca15b8c'},@{v='0.20.24';sha='249ac3ba16e1c8a64599e48c2a62df4146819d8843be41cd359a0fbdb7f6c64d';core='cbd04b705f7c7fbdddd7e38de28ef3a240590d8681825cae78f2ab6640e60cbe'})
        $running=@()
        foreach($rel in $releases){
         $v=$rel.v;$zip=Join-Path $root ($v+'.zip');$url='https://github.com/taisukek13-tech/KuzeliaStudio-Updates/releases/download/v'+$v+'/KuzeliaStudio_Update_v'+$v+'.zip'
         $si=[Diagnostics.ProcessStartInfo]::new('curl.exe');$si.UseShellExecute=$false;foreach($x in @('--fail','--silent','--show-error','--location','--retry','2','--max-time','240','--output',$zip,$url)){$si.ArgumentList.Add($x)}
         $running+=[Diagnostics.Process]::Start($si)
        }
        foreach($p in $running){$p.WaitForExit();if($p.ExitCode -ne 0){throw 'Could not fetch official runtime'};$p.Dispose()}
        foreach($rel in $releases){
         $v=$rel.v;$zip=Join-Path $root ($v+'.zip');if((Get-FileHash $zip).Hash -ne $rel.sha){throw "Wrong release $v"};$dir=Join-Path $root $v;[IO.Compression.ZipFile]::ExtractToDirectory($zip,$dir)
         $app=Join-Path $dir 'KuzeliaStudio';if((Get-FileHash (Join-Path $app 'Kuzelia.Core.dll')).Hash -ne $rel.core){throw 'Wrong official Core'}
         $name=if($v -eq '0.20.23'){'OLD_APP'}else{'NEW_APP'};"$name=$app" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
        }
        @{os=[Environment]::OSVersion.VersionString;cpu=@(Get-CimInstance Win32_Processor | Select-Object Name,NumberOfLogicalProcessors,NumberOfCores);memory=(Get-CimInstance Win32_ComputerSystem).TotalPhysicalMemory;display=@(Get-CimInstance Win32_VideoController|Select-Object Name);release=$releases} | ConvertTo-Json -Depth 6 | Set-Content -LiteralPath (Join-Path $report 'machine.json')
        "DIAGNOSTIC_DIR=$bin" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
        "EVIDENCE_DIR=$report" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
        Start-Sleep -Seconds 20
    - name: Observe real titlebar close, process lifetime, foreground timing and whole-system activity
      shell: pwsh
      run: |
        $ErrorActionPreference='Stop'
        & dotnet (Join-Path $env:DIAGNOSTIC_DIR 'ExitStudy.dll') run $env:OLD_APP $env:NEW_APP $env:EVIDENCE_DIR $env:OBSERVATION_ORDER
        if($LASTEXITCODE -ne 0){throw 'The observation program exited abnormally'}
        $r=Get-Content (Join-Path $env:EVIDENCE_DIR 'study.json') -Raw | ConvertFrom-Json
        if($r.status -ne 'finished' -or $r.front.Count -lt 400 -or $r.samples.Count -lt 40 -or $r.scenarios.Count -lt 1){throw 'Incomplete close observations'}
        foreach($s in $r.scenarios){Write-Output ("{0}: primaryPID={1} exitMs={2} stillAlive={3} duplicateAlive={4} duplicateDialog={5} duplicateExitedAfterOK={6}" -f $s.name,$s.primaryPid,$s.rootExitMs,$s.primaryAliveAfterWindow,$s.duplicateAliveAfterWindow,$s.duplicateWindowAfterClose,$s.duplicateExitedAfterOk)}
    - name: Save raw system, process and foreground time series
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: Kuzelia-Idle-Close-${{ matrix.order }}-${{ github.run_id }}
        path: ${{ runner.temp }}/regular-close-study/evidence/*.json
        if-no-files-found: warn
        retention-days: 3
