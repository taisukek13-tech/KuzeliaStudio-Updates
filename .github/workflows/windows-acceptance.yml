name: Windows acceptance
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Public validation-kit release tag
        required: true
        default: validation-v0.18.0-c2
      version:
        description: App version
        required: true
        default: 0.18.0
      archive_sha256:
        description: Exact signed runtime ZIP SHA-256
        required: true
        default: ae4757d89bc078d72205d6aefa08dd68630cabd8170e131f26510e0178a326b8
      core_sha256:
        description: Verified Core SHA-256
        required: true
        default: 750557b77348b1ead28c3ffe6abd003c383680a8318d6a75deddc14d6f07836c
      kit_sha256:
        description: Public restoration kit SHA-256
        required: true
        default: 2e27332cd75f950983998277ea49dc9530eb19740c2c0ba489698f2f9e64884c
permissions:
  contents: read
jobs:
  prepare:
    if: github.repository == 'taisukek13-tech/KuzeliaStudio-Updates' && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      setup_sha: ${{ steps.prepare.outputs.setup_sha }}
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
      KIT_SHA: ${{ inputs.kit_sha256 }}
      ZIP_SHA: ${{ inputs.archive_sha256 }}
      CORE_SHA: ${{ inputs.core_sha256 }}
    steps:
      - name: Restore exact signed runtime and compile owned-file installer
        id: prepare
        shell: bash
        run: |
          python3 - <<'PYCODE'
          import hashlib,json,os,re,subprocess,sys,urllib.request,zipfile
          from pathlib import Path
          for key in ['KIT_SHA','ZIP_SHA','CORE_SHA']:
              if not re.fullmatch('[a-f0-9]{64}',os.environ[key]):raise ValueError('Invalid validation digest')
          tag=os.environ['RELEASE_TAG']
          if not re.fullmatch('[A-Za-z0-9._-]+',tag):raise ValueError('Invalid validation tag')
          root=Path(os.environ['RUNNER_TEMP'])/'KuzeliaPrepared';root.mkdir();kit=root/'kit';kit.mkdir()
          url='https://github.com/taisukek13-tech/KuzeliaStudio-Updates/releases/download/'+tag+'/KuzeliaStudio_WindowsValidationKit_v0.18.0.zip'
          with urllib.request.urlopen(url,timeout=180) as response:data=response.read(10*1024*1024+1)
          if len(data)>10*1024*1024 or hashlib.sha256(data).hexdigest()!=os.environ['KIT_SHA']:raise ValueError('Validation kit digest differs')
          path=root/'kit.zip';path.write_bytes(data)
          with zipfile.ZipFile(path) as archive:
              if set(archive.namelist())!={'runtime-checkpoint.zip','restore.py','restore_and_build.py','kuzelia.ico','metadata.json','installer.nsi','public-key.txt'}:raise ValueError('Unexpected kit content')
              archive.extractall(kit)
          metadata=json.loads((kit/'metadata.json').read_text())
          if metadata['runtimeSha256']!=os.environ['ZIP_SHA'] or metadata['coreSha256']!=os.environ['CORE_SHA']:raise ValueError('Kit describes another candidate')
          subprocess.run([sys.executable,str(kit/'restore_and_build.py')],check=True)
          PYCODE
      - name: Retain exact runtime ZIP for Windows checks and publication
        uses: actions/upload-artifact@v7
        with:
          path: ${{ runner.temp }}/KuzeliaPrepared/dist/KuzeliaStudio_Update_v0.18.0.zip
          archive: false
          retention-days: 1
      - name: Retain setup for Windows checks and publication
        uses: actions/upload-artifact@v7
        with:
          path: ${{ runner.temp }}/KuzeliaPrepared/dist/KuzeliaStudio_Setup_v0.18.0.exe
          archive: false
          retention-days: 1
      - name: Retain signature, inventory and preparation record
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Kuzelia-Prepared-Metadata-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/KuzeliaPrepared/dist/prepared-artifacts.json
            ${{ runner.temp }}/KuzeliaPrepared/dist/installer-build.log
          retention-days: 1
          if-no-files-found: warn
  windows:
    needs: prepare
    if: github.repository == 'taisukek13-tech/KuzeliaStudio-Updates' && github.event.repository.private == false
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
      APP_VERSION: ${{ inputs.version }}
      ZIP_SHA: ${{ inputs.archive_sha256 }}
      CORE_SHA: ${{ inputs.core_sha256 }}
      SETUP_SHA: ${{ needs.prepare.outputs.setup_sha }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: KuzeliaStudio_Update_v0.18.0.zip
          path: ${{ runner.temp }}/KuzeliaAcceptanceIncoming
          skip-decompress: true
      - uses: actions/download-artifact@v8
        with:
          name: KuzeliaStudio_Setup_v0.18.0.exe
          path: ${{ runner.temp }}/KuzeliaAcceptanceIncoming
          skip-decompress: true
      - name: Download and verify the official validation runtime
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if($env:RELEASE_TAG -notmatch '^[A-Za-z0-9._-]+$' -or $env:APP_VERSION -notmatch '^\d+\.\d+\.\d+$' -or $env:ZIP_SHA -notmatch '^[a-f0-9]{64}$' -or $env:CORE_SHA -notmatch '^[a-f0-9]{64}$'){throw 'Invalid validation inputs'}
          $base=Join-Path $env:RUNNER_TEMP 'KuzeliaAcceptance'
          $reports=Join-Path $env:RUNNER_TEMP 'KuzeliaAcceptanceReports'
          New-Item -ItemType Directory -Path $base,$reports -Force|Out-Null
          $zip=Join-Path $env:RUNNER_TEMP 'KuzeliaAcceptanceIncoming\KuzeliaStudio_Update_v0.18.0.zip'
          if((Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:ZIP_SHA){throw 'Runtime ZIP digest mismatch'}
          Expand-Archive -LiteralPath $zip -DestinationPath $base
          $appRoot=Join-Path $base 'KuzeliaStudio'
          if((Get-FileHash (Join-Path $appRoot 'Kuzelia.Core.dll') -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:CORE_SHA){throw 'Core digest mismatch'}
          'APP_ROOT='+$appRoot|Out-File $env:GITHUB_ENV -Append -Encoding utf8
          'REPORT_ROOT='+$reports|Out-File $env:GITHUB_ENV -Append -Encoding utf8
          $hardware=@{os=[Environment]::OSVersion.VersionString;cpu=@(Get-CimInstance Win32_Processor|Select-Object Name,NumberOfCores,NumberOfLogicalProcessors);memoryBytes=(Get-CimInstance Win32_ComputerSystem).TotalPhysicalMemory;graphics=@(Get-CimInstance Win32_VideoController|Select-Object Name,DriverVersion);authenticode=(Get-AuthenticodeSignature (Join-Path $appRoot 'KuzeliaStudio.exe')).Status.ToString();limits='Standard hosted Windows VM, not the user PC or RTX benchmark.'}
          $hardware|ConvertTo-Json -Depth 8|Set-Content (Join-Path $reports 'hardware.json') -Encoding utf8
      - name: Run isolated Windows UI and real 1080p encode checks
        shell: pwsh
        run: |
          $app=Join-Path $env:APP_ROOT 'KuzeliaStudio.exe'
          $argument='--self-test-output "'+$env:REPORT_ROOT+'"'
          $p=Start-Process -FilePath $app -ArgumentList $argument -PassThru
          if(-not $p.WaitForExit(900000)){Stop-Process -Id $p.Id -Force;throw 'UI test exceeded 15 minutes'}
          $path=Join-Path $env:REPORT_ROOT 'ui-acceptance.json'
          if(-not (Test-Path $path)){throw 'App did not write a completion report'}
          $result=Get-Content $path -Raw|ConvertFrom-Json
          Get-Content $path -Raw|Write-Output
          if($p.ExitCode -ne 0 -or -not $result.passed){throw 'Windows UI or encoding acceptance failed'}
      - name: Test new installation, repair and user-data preservation
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if($env:SETUP_SHA -notmatch '^[a-f0-9]{64}$'){throw 'Invalid setup SHA-256'}
          $setup=Join-Path $env:RUNNER_TEMP 'KuzeliaAcceptanceIncoming\KuzeliaStudio_Setup_v0.18.0.exe'
          if((Get-FileHash $setup -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:SETUP_SHA){throw 'Setup digest mismatch'}
          $target=Join-Path $env:RUNNER_TEMP 'KuzeliaInstallTest'
          $normal=Join-Path $env:LOCALAPPDATA 'KuzeliaStudio.Native'
          New-Item -ItemType Directory -Path $normal -Force|Out-Null
          $sentinel=Join-Path $normal 'ci-user-data.txt'
          [IO.File]::WriteAllText($sentinel,'USER-DATA-KEEP')
          function Install { $p=Start-Process -FilePath $setup -ArgumentList @('/S',('/D='+$target)) -PassThru -Wait;if($p.ExitCode -ne 0){throw 'Setup did not complete'} }
          Install
          [IO.File]::WriteAllText((Join-Path $target 'my-recording.mp4'),'SOURCE-KEEP')
          New-Item -ItemType Directory -Path (Join-Path $target 'my-fonts') -Force|Out-Null
          [IO.File]::WriteAllText((Join-Path $target 'my-fonts\custom.ttf'),'FONT-KEEP')
          Install
          $envelope=Get-Content (Join-Path $env:APP_ROOT 'update-release.json') -Raw|ConvertFrom-Json
          $manifest=[Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($envelope.payload))|ConvertFrom-Json
          foreach($file in $manifest.files){$path=Join-Path $target $file.path;if(-not (Test-Path $path) -or (Get-FileHash $path -Algorithm SHA256).Hash.ToLowerInvariant() -ne $file.sha256){throw ('Installed file differs: '+$file.path)}}
          $p=Start-Process -FilePath (Join-Path $target 'Uninstall.exe') -ArgumentList '/S' -PassThru -Wait
          for($i=0;$i -lt 40 -and (Test-Path (Join-Path $target 'KuzeliaStudio.exe'));$i++){Start-Sleep -Milliseconds 250}
          $preserved=([IO.File]::ReadAllText($sentinel) -eq 'USER-DATA-KEEP' -and [IO.File]::ReadAllText((Join-Path $target 'my-recording.mp4')) -eq 'SOURCE-KEEP' -and [IO.File]::ReadAllText((Join-Path $target 'my-fonts\custom.ttf')) -eq 'FONT-KEEP')
          $gone=-not (Test-Path (Join-Path $target 'KuzeliaStudio.exe'))
          @{installedInventoryVerified=$true;repairCompleted=$true;uninstallRemovedOwnedApp=$gone;sourceSettingsAndFontsPreserved=$preserved;limits='Ephemeral hosted Windows user, not antivirus or real in-app update/restart acceptance.'}|ConvertTo-Json|Tee-Object -FilePath (Join-Path $env:REPORT_ROOT 'installer-acceptance.json')
          if(-not $preserved -or -not $gone){throw 'Installer user-data preservation failed'}
      - name: Retain small acceptance reports and app-window captures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Kuzelia-Windows-Acceptance-${{ github.run_id }}
          path: ${{ runner.temp }}/KuzeliaAcceptanceReports
          retention-days: 1
          if-no-files-found: warn
