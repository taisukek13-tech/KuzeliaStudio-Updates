name: Windows acceptance
on:
  push:
    branches: [validation-v0.20.22-c1]
    paths: ['.github/workflows/windows-acceptance.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live-windows:
    if: github.repository == 'taisukek13-tech/KuzeliaStudio-Updates' && github.event.repository.private == false
    runs-on: windows-latest
    timeout-minutes: 8
    env:
      APP_VERSION: '0.20.22'
      CORE_SHA: f5e105011c1629df7aa9e9d258387961e1893900edfdf7a52b14723754d24ee6
    steps:
      - name: Fetch and verify the released v19 runtime in a fresh hosted user
        shell: pwsh
        timeout-minutes: 3
        run: |
          $ErrorActionPreference='Stop'; $ProgressPreference='SilentlyContinue'
          $rootDir=Join-Path $env:RUNNER_TEMP 'normal-public-update'
          $reports=Join-Path $rootDir 'reports'
          [IO.Directory]::CreateDirectory($reports)|Out-Null
          $zip=Join-Path $rootDir 'v19.zip'
          curl.exe -fLsS --retry 2 --max-time 100 -o $zip https://github.com/taisukek13-tech/KuzeliaStudio-Updates/releases/download/v0.20.19/KuzeliaStudio_Update_v0.20.19.zip
          if($LASTEXITCODE -ne 0){throw 'Could not fetch released old runtime'}
          $stream=[IO.File]::OpenRead($zip)
          try{$hash=[Convert]::ToHexString([Security.Cryptography.SHA256]::HashData($stream)).ToLowerInvariant()}finally{$stream.Dispose()}
          if($hash -ne '75442d258c2a3843136c416f7e2437309a74304577d245d7ad1ec2fbb199b5d8'){throw 'Public old runtime digest differs'}
          $old=Join-Path $rootDir 'baseline'
          [IO.Compression.ZipFile]::ExtractToDirectory($zip,$old)
          $app=Join-Path $old 'KuzeliaStudio'
          if(-not [IO.File]::Exists((Join-Path $app 'KuzeliaStudio.exe'))){throw 'Baseline app did not extract'}
          Add-Content -LiteralPath $env:GITHUB_ENV -Value ('LIVE_OLD_ROOT='+$app) -Encoding utf8
          Add-Content -LiteralPath $env:GITHUB_ENV -Value ('LIVE_PROOF='+$reports) -Encoding utf8
          Write-Output ('Verified the released untouched baseline '+$hash)
      - name: Use real v19 controls on the production Latest feed and verify the restarted app
        shell: pwsh
        timeout-minutes: 5
        run: |
          $source=@'
          $ErrorActionPreference='Stop'
          $env:PSModulePath=$PSHOME+'\Modules;'+$env:ProgramFiles+'\WindowsPowerShell\Modules'
          Import-Module Microsoft.PowerShell.Management,Microsoft.PowerShell.Utility -ErrorAction Stop
          $ProgressPreference='SilentlyContinue'
          Add-Type -AssemblyName UIAutomationClient, UIAutomationTypes, WindowsBase
          $uiReferences=@([Windows.Automation.AutomationElement].Assembly.Location,[Windows.Automation.ControlType].Assembly.Location,[Windows.DependencyObject].Assembly.Location) | Select-Object -Unique
          # Desktop automation providers may wait for a modal window to close. Keep its caller independent.
          Add-Type -ReferencedAssemblies $uiReferences -TypeDefinition @"
          using System;
          using System.Threading;
          using System.Windows.Automation;
          public static class UiClick {
              public static volatile string LastError;
              [System.Runtime.InteropServices.DllImport("user32.dll")]
              public static extern IntPtr GetForegroundWindow();
              public static void Invoke(AutomationElement element) {
                  InvokePattern button=(InvokePattern)element.GetCurrentPattern(InvokePattern.Pattern);
                  Thread thread=new Thread(delegate() { try { button.Invoke(); } catch (Exception ex) { LastError=ex.Message; } });
                  thread.IsBackground=true; thread.SetApartmentState(ApartmentState.MTA); thread.Start();
              }
          }
          "@
          $root=[Windows.Automation.AutomationElement]::RootElement
          $desc=[Windows.Automation.TreeScope]::Descendants
          function Condition($property,$value){[Windows.Automation.PropertyCondition]::new($property,$value)}
          function ByName($parent,[string]$name){
              if($null -eq $parent){return}
              $parent.FindFirst($desc,(Condition ([Windows.Automation.AutomationElement]::NameProperty) $name))
          }
          function NamedButton($parent,[string]$name){
              if($null -eq $parent){return}
              $nameTest=Condition ([Windows.Automation.AutomationElement]::NameProperty) $name
              $typeTest=Condition ([Windows.Automation.AutomationElement]::ControlTypeProperty) ([Windows.Automation.ControlType]::Button)
              $ee=$parent.FindFirst($desc,([Windows.Automation.AndCondition]::new($nameTest,$typeTest)))
              if($ee -and $ee.Current.IsEnabled){$ee}
          }
          function ById($parent,[string]$id){
              if($null -eq $parent){return}
              $parent.FindFirst($desc,(Condition ([Windows.Automation.AutomationElement]::AutomationIdProperty) $id))
          }
          function ProcessWindow([int]$processId,[string]$prefix){
              $wins=$root.FindAll([Windows.Automation.TreeScope]::Children,(Condition ([Windows.Automation.AutomationElement]::ProcessIdProperty) $processId))
              foreach($w in $wins){if($w.Current.Name.StartsWith($prefix)){return $w}}
              $handle=[UiClick]::GetForegroundWindow()
              if($handle -ne [IntPtr]::Zero){
                  $front=[Windows.Automation.AutomationElement]::FromHandle($handle)
                  if($front.Current.ProcessId -eq $processId -and $front.Current.Name.StartsWith($prefix)){return $front}
              }
              $windowKind=Condition ([Windows.Automation.AutomationElement]::ControlTypeProperty) ([Windows.Automation.ControlType]::Window)
              foreach($w in $wins){foreach($child in $w.FindAll($desc,$windowKind)){if($child.Current.Name.StartsWith($prefix)){return $child}}}
          }
          function WaitFor([string]$label,[scriptblock]$test,[int]$seconds=60){
              $clock=[Diagnostics.Stopwatch]::StartNew()
              while($clock.Elapsed.TotalSeconds -lt $seconds){
                  try{$value=& $test;if($null -ne $value -and $value -ne $false){return $value}}catch [Windows.Automation.ElementNotAvailableException]{} catch [System.Runtime.InteropServices.COMException]{}
                  Start-Sleep -Milliseconds 250
              }
              throw "Timed out waiting for $label. Automation provider: $([UiClick]::LastError)"
          }

          function FileDigest([string]$file){
              $stream=[IO.File]::OpenRead($file);$h=[Security.Cryptography.SHA256]::Create()
              try{return ([BitConverter]::ToString($h.ComputeHash($stream))).Replace('-','').ToLowerInvariant()}finally{$h.Dispose();$stream.Dispose()}
          }
          $target=$env:LIVE_OLD_ROOT;$targetExe=Join-Path $target 'KuzeliaStudio.exe'
          $normal=Join-Path $env:LOCALAPPDATA 'KuzeliaStudio.Native';$parent=$null
          $outfile=Join-Path $env:LIVE_PROOF 'live-update.json';$utf8=New-Object Text.UTF8Encoding($false)
          $report=[ordered]@{passed=$false;fromVersion='0.20.19';toVersion='0.20.22';channel='';openedUpdateWindow=$false;checkedProductionFeed=$false;networkDownloadedCandidate=$false;restartButtonInvoked=$false;oldHelperObserved=$false;scope='Public v0.20.19, unmodified default Latest HTTPS, real visible buttons. Isolated hosted Windows VM, pinned public delta and signed inventory.';events=@()}
          function Mark([string]$activity){
              $report.events+=@{at=[DateTime]::UtcNow.ToString('o');activity=$activity}
              Write-Output $activity
              [IO.File]::WriteAllText($outfile,($report|ConvertTo-Json -Depth 8),$utf8)
          }
          try{
              if((FileDigest (Join-Path $target 'Kuzelia.Core.dll')) -ne 'c0718052e6ca6b0aa8e0809f3bec4d47462aba598cef721969bccb033c5667d8'){throw 'Old Core differs'}
              $report.channel=([IO.File]::ReadAllText((Join-Path $target 'update-channel.json'))|ConvertFrom-Json).feedUrl
              if($report.channel -ne 'https://github.com/taisukek13-tech/KuzeliaStudio-Updates/releases/latest/download/latest.json'){throw 'Unexpected built-in release channel'}
              $null=[IO.Directory]::CreateDirectory($normal)
              if([IO.File]::Exists((Join-Path $normal 'update-source.json')) -or [IO.Directory]::Exists((Join-Path $normal 'Updates\Downloads'))){throw 'The stock app must start without override or cached package'}
              [IO.File]::WriteAllText((Join-Path $normal 'update-preferences.json'),'{"automatic":false}')
              [IO.File]::WriteAllText((Join-Path $target 'my-recording.mp4'),'UPDATE-SOURCE-KEEP')
              [IO.File]::WriteAllText((Join-Path $normal 'ci-update-user-data.txt'),'UPDATE-DATA-KEEP')
              Mark 'Launch the untouched public v0.20.19 app'
              $parent=Start-Process -FilePath $targetExe -WorkingDirectory $target -PassThru
              $homeWindow=WaitFor 'old app window' {$parent.Refresh();if($parent.HasExited){throw 'Old app exited early'};if($parent.MainWindowHandle -ne 0){[Windows.Automation.AutomationElement]::FromHandle($parent.MainWindowHandle)}} 90
              [UiClick]::Invoke((WaitFor 'home update button' {NamedButton $homeWindow 'アプリを更新'}))
              $dialog=WaitFor 'update window' {ProcessWindow $parent.Id 'アプリを更新'}
              $report.openedUpdateWindow=$true; Mark 'Opened the stock update dialog'
              [UiClick]::Invoke((WaitFor 'check latest button' {NamedButton $dialog '最新版を確認・取得'}))

              Start-Sleep -Milliseconds 700
              $ready=$null
              for($attempt=1;$attempt -le 3;$attempt++){
                  $resolved=WaitFor 'fresh production updater result' {
                      if(NamedButton $dialog '更新して再起動'){return 'ready'}
                      if((NamedButton $dialog '最新版を確認・取得') -and (ByName $dialog 'この配信先の最新版を使用しています。')){return 'old-feed'}
                  } 50
                  if($resolved -eq 'ready'){$ready=$true;break}
                  if($attempt -lt 3){Start-Sleep -Seconds 4;[UiClick]::Invoke((WaitFor 'check again' {NamedButton $dialog '最新版を確認・取得'}));Start-Sleep -Milliseconds 700}
              }
              if(-not $ready){throw 'Released candidate was not offered by the default feed'}
              $report.checkedProductionFeed=$true
              $rootCache=Join-Path $normal 'Updates\Downloads'
              $deltaHash='d74532ce9aa4b094b83dca1366092c2d646ad5a9fc5ba8e695eaf900d9914d54'
              $hits=@([IO.Directory]::GetFiles($rootCache,('update-'+$deltaHash+'.zip'),[IO.SearchOption]::AllDirectories))
              if($hits.Count -ne 1){throw 'Expected the genuine public v19-to-v22 delta in the empty cache'}
              $report.downloadedPackageSha256=FileDigest $hits[0]
              $report.downloadedPackageBytes=([IO.FileInfo]::new($hits[0])).Length
              $report.downloadedFeedSha256=FileDigest ([IO.Path]::Combine([IO.Path]::GetDirectoryName($hits[0]),'feed.json'))
              if($report.downloadedPackageSha256 -ne $deltaHash -or $report.downloadedPackageBytes -ne 1988664 -or $report.downloadedFeedSha256 -ne 'c9814c02f21e76c54eb1c88ce456e00a246d0ad0074305fcc05e5c9ba1dcd13e'){throw 'Downloaded delta or signed public feed differs'}
              $report.networkDownloadedCandidate=$true
              Mark 'Stock app fetched and verified the released delta and feed'
              [UiClick]::Invoke((WaitFor 'update and restart button' {NamedButton $dialog '更新して再起動'}))
              $report.restartButtonInvoked=$true; Mark 'Restart requested in the old app window'
              $restarted=WaitFor 'same installed app process restarts' {
                  $parent.Refresh()
                  foreach($p in Get-Process KuzeliaStudio -ErrorAction SilentlyContinue){
                      if($p.MainModule.FileName -like "$normal\Updates\*\runner\KuzeliaStudio.exe"){$report.oldHelperObserved=$true}
                      if($p.MainModule.FileName -eq $targetExe -and $p.Id -ne $parent.Id -and $parent.HasExited -and $p.MainWindowHandle -ne 0){return $p}
                  }
              } 90
              $report.oldParentExited=$parent.HasExited;$report.restartedWindowPresent=$restarted.MainWindowHandle -ne 0
              $report.restartedFileVersion=[Diagnostics.FileVersionInfo]::GetVersionInfo((Join-Path $target 'KuzeliaStudio.dll')).FileVersion
              if(-not $report.restartedFileVersion.StartsWith($env:APP_VERSION+'.') -or (FileDigest (Join-Path $target 'Kuzelia.Core.dll')) -ne $env:CORE_SHA){throw 'Restarted app version or Core differs'}
              $envelope=Get-Content (Join-Path $target 'update-release.json') -Raw|ConvertFrom-Json
              $manifest=[Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($envelope.payload))|ConvertFrom-Json
              foreach($file in $manifest.files){if((FileDigest (Join-Path $target $file.path)) -ne $file.sha256){throw ('Installed file differs: '+$file.path)}}
              $report.signedFilesVerified=$manifest.files.Count
              if([IO.File]::ReadAllText((Join-Path $target 'my-recording.mp4')) -ne 'UPDATE-SOURCE-KEEP' -or [IO.File]::ReadAllText((Join-Path $normal 'ci-update-user-data.txt')) -ne 'UPDATE-DATA-KEEP'){throw 'User data changed'}
              $report.unownedAndUserDataPreserved=$true
              $runOnce=[Microsoft.Win32.Registry]::CurrentUser.OpenSubKey('Software\Microsoft\Windows\CurrentVersion\RunOnce')
              try{if($runOnce -and $null -ne $runOnce.GetValue('KuzeliaStudioUpdate',$null)){throw 'Updater RunOnce was not cleared'}}finally{if($runOnce){$runOnce.Dispose()}}
              $report.recoveryRegistrationCleared=$true;$report.passed=$true

              if($report.signedFilesVerified -ne 824){throw 'Wrong inventory size'}
              Mark 'Verified updated window, 824 files and retained user fixtures'
          }catch{
              $report.passed=$false;$report.error=$_.Exception.Message
              throw
          }finally{
              [IO.File]::WriteAllText($outfile,($report|ConvertTo-Json -Depth 8),$utf8)
              if($targetExe){foreach($p in [Diagnostics.Process]::GetProcessesByName('KuzeliaStudio')){if($p.MainModule.FileName -eq $targetExe){if(-not $p.CloseMainWindow() -or -not $p.WaitForExit(6000)){$p.Kill()}}}}
          }
          '@
          $driverPath=Join-Path $env:RUNNER_TEMP 'kuzelia-public-update.ps1'
          [IO.File]::WriteAllText($driverPath,$source,[Text.UTF8Encoding]::new($true))
          $legacyExe=Join-Path $env:windir 'System32\WindowsPowerShell\v1.0\powershell.exe'
          $driver=Start-Process -FilePath $legacyExe -ArgumentList @('-NoLogo','-NoProfile','-NonInteractive','-STA','-ExecutionPolicy','Bypass','-File',('"'+$driverPath+'"')) -NoNewWindow -PassThru
          if(-not $driver.WaitForExit(215000)){Stop-Process -Id $driver.Id -Force;throw 'Post-publication Windows UI exceeded 215 seconds; see recorded events.'}
          if($driver.ExitCode -ne 0){throw 'Public in-app update failed'}
          $proof=Get-Content (Join-Path $env:LIVE_PROOF 'live-update.json') -Raw | ConvertFrom-Json
          if(-not $proof.passed -or -not $proof.networkDownloadedCandidate -or -not $proof.restartButtonInvoked -or -not $proof.restartedWindowPresent -or $proof.signedFilesVerified -ne 824){throw 'Incomplete public update proof'}
          Write-Output ($proof | ConvertTo-Json -Depth 8)
      - name: Retain the public in-app update receipt
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Kuzelia-Live-Update-${{ github.run_id }}
          path: ${{ runner.temp }}/normal-public-update/reports
          if-no-files-found: warn
          retention-days: 3
