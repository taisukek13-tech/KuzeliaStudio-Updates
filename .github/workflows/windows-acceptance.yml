name: Windows acceptance
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Public validation-kit release tag
        required: true
        default: validation-v0.18.3-c3
      version:
        description: App version
        required: true
        default: 0.18.3
      archive_sha256:
        description: Exact signed runtime ZIP SHA-256
        required: true
        default: e50c139796ea5c93f01ed3e5e6a0c01e10c219dfeedbd07a926fec5d156dc4a3
      core_sha256:
        description: Verified Core SHA-256
        required: true
        default: e1cb327139683a708eab456cd02ec967dd5702592a56d37f04acaceef0432d75
      kit_sha256:
        description: Public restoration kit SHA-256
        required: true
        default: 43537c9278aa8b66c8b2b0ccc15bacd0aeeaa1e90402a69f5e50ece3f9b6668a
permissions:
  contents: read
jobs:
  prepare:
    if: github.repository == 'taisukek13-tech/KuzeliaStudio-Updates' && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      setup_sha: ${{ steps.prepare.outputs.setup_sha }}
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
      KIT_SHA: ${{ inputs.kit_sha256 }}
      ZIP_SHA: ${{ inputs.archive_sha256 }}
      CORE_SHA: ${{ inputs.core_sha256 }}
    steps:
      - name: Restore exact signed runtime and compile owned-file installer
        id: prepare
        shell: bash
        run: |
          python3 - <<'PYCODE'
          import hashlib,json,os,re,subprocess,sys,urllib.request,zipfile
          from pathlib import Path
          for key in ['KIT_SHA','ZIP_SHA','CORE_SHA']:
              if not re.fullmatch('[a-f0-9]{64}',os.environ[key]):raise ValueError('Invalid validation digest')
          tag=os.environ['RELEASE_TAG']
          if not re.fullmatch('[A-Za-z0-9._-]+',tag):raise ValueError('Invalid validation tag')
          root=Path(os.environ['RUNNER_TEMP'])/'KuzeliaPrepared';root.mkdir();kit=root/'kit';kit.mkdir()
          url='https://github.com/taisukek13-tech/KuzeliaStudio-Updates/releases/download/'+tag+'/KuzeliaStudio_WindowsValidationKit_v0.18.3.zip'
          with urllib.request.urlopen(url,timeout=180) as response:data=response.read(10*1024*1024+1)
          if len(data)>10*1024*1024 or hashlib.sha256(data).hexdigest()!=os.environ['KIT_SHA']:raise ValueError('Validation kit digest differs')
          path=root/'kit.zip';path.write_bytes(data)
          with zipfile.ZipFile(path) as archive:
              if set(archive.namelist())!={'runtime-checkpoint.zip','restore.py','restore_and_build.py','kuzelia.ico','metadata.json','installer.nsi','public-key.txt'}:raise ValueError('Unexpected kit content')
              archive.extractall(kit)
          metadata=json.loads((kit/'metadata.json').read_text())
          if metadata['runtimeSha256']!=os.environ['ZIP_SHA'] or metadata['coreSha256']!=os.environ['CORE_SHA']:raise ValueError('Kit describes another candidate')
          subprocess.run([sys.executable,str(kit/'restore_and_build.py')],check=True)
          PYCODE
      - name: Retain exact runtime ZIP for Windows checks and publication
        uses: actions/upload-artifact@v7
        with:
          path: ${{ runner.temp }}/KuzeliaPrepared/dist/KuzeliaStudio_Update_v0.18.3.zip
          archive: false
          retention-days: 1
      - name: Retain setup for Windows checks and publication
        uses: actions/upload-artifact@v7
        with:
          path: ${{ runner.temp }}/KuzeliaPrepared/dist/KuzeliaStudio_Setup_v0.18.3.exe
          archive: false
          retention-days: 1
      - name: Retain signature, inventory and preparation record
        continue-on-error: true
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Kuzelia-Prepared-Metadata-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/KuzeliaPrepared/dist/prepared-artifacts.json
            ${{ runner.temp }}/KuzeliaPrepared/dist/installer-build.log
          retention-days: 1
          if-no-files-found: warn
  windows:
    needs: prepare
    if: github.repository == 'taisukek13-tech/KuzeliaStudio-Updates' && github.event.repository.private == false
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
      APP_VERSION: ${{ inputs.version }}
      ZIP_SHA: ${{ inputs.archive_sha256 }}
      CORE_SHA: ${{ inputs.core_sha256 }}
      SETUP_SHA: ${{ needs.prepare.outputs.setup_sha }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: KuzeliaStudio_Update_v0.18.3.zip
          path: ${{ runner.temp }}/KuzeliaAcceptanceIncoming
          skip-decompress: true
      - uses: actions/download-artifact@v8
        with:
          name: KuzeliaStudio_Setup_v0.18.3.exe
          path: ${{ runner.temp }}/KuzeliaAcceptanceIncoming
          skip-decompress: true
      - name: Download and verify the official validation runtime
        id: runtime
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if($env:RELEASE_TAG -notmatch '^[A-Za-z0-9._-]+$' -or $env:APP_VERSION -notmatch '^\d+\.\d+\.\d+$' -or $env:ZIP_SHA -notmatch '^[a-f0-9]{64}$' -or $env:CORE_SHA -notmatch '^[a-f0-9]{64}$'){throw 'Invalid validation inputs'}
          $base=Join-Path $env:RUNNER_TEMP 'KuzeliaAcceptance'
          $reports=Join-Path $env:RUNNER_TEMP 'KuzeliaAcceptanceReports'
          New-Item -ItemType Directory -Path $base,$reports -Force|Out-Null
          $zip=Join-Path $env:RUNNER_TEMP 'KuzeliaAcceptanceIncoming\KuzeliaStudio_Update_v0.18.3.zip'
          if((Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:ZIP_SHA){throw 'Runtime ZIP digest mismatch'}
          Expand-Archive -LiteralPath $zip -DestinationPath $base
          $appRoot=Join-Path $base 'KuzeliaStudio'
          if((Get-FileHash (Join-Path $appRoot 'Kuzelia.Core.dll') -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:CORE_SHA){throw 'Core digest mismatch'}
          'APP_ROOT='+$appRoot|Out-File $env:GITHUB_ENV -Append -Encoding utf8
          'REPORT_ROOT='+$reports|Out-File $env:GITHUB_ENV -Append -Encoding utf8
          $hardware=@{os=[Environment]::OSVersion.VersionString;cpu=@(Get-CimInstance Win32_Processor|Select-Object Name,NumberOfCores,NumberOfLogicalProcessors);memoryBytes=(Get-CimInstance Win32_ComputerSystem).TotalPhysicalMemory;graphics=@(Get-CimInstance Win32_VideoController|Select-Object Name,DriverVersion);authenticode=(Get-AuthenticodeSignature (Join-Path $appRoot 'KuzeliaStudio.exe')).Status.ToString();limits='Standard hosted Windows VM, not the user PC or RTX benchmark.'}
          $hardware|ConvertTo-Json -Depth 8|Set-Content (Join-Path $reports 'hardware.json') -Encoding utf8
      - name: Run isolated Windows UI and real 1080p encode checks
        shell: pwsh
        run: |
          $app=Join-Path $env:APP_ROOT 'KuzeliaStudio.exe'
          $argument='--self-test-output "'+$env:REPORT_ROOT+'"'
          $p=Start-Process -FilePath $app -ArgumentList $argument -PassThru
          if(-not $p.WaitForExit(900000)){Stop-Process -Id $p.Id -Force;throw 'UI test exceeded 15 minutes'}
          $path=Join-Path $env:REPORT_ROOT 'ui-acceptance.json'
          if(-not (Test-Path $path)){throw 'App did not write a completion report'}
          $result=Get-Content $path -Raw|ConvertFrom-Json
          Get-Content $path -Raw|Write-Output
          if($p.ExitCode -ne 0 -or -not $result.passed){throw 'Windows UI or encoding acceptance failed'}
      - name: Independently verify square pixels and portrait display ratio
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $probe=Join-Path $env:APP_ROOT 'Tools/ffprobe.exe'
          $checks=@()
          foreach($fps in @(30,60)){foreach($requested in @('cpu','nvidia')){
            $movie=Join-Path $env:REPORT_ROOT "encode-$requested-$fps.mp4"
            $raw=& $probe -v error -select_streams v:0 -show_entries stream=width,height,sample_aspect_ratio,display_aspect_ratio,avg_frame_rate -of json $movie|Out-String
            if($LASTEXITCODE -ne 0){throw 'Independent aspect probe failed'}
            $stream=($raw|ConvertFrom-Json).streams[0]
            if($stream.width -ne 1080 -or $stream.height -ne 1920 -or $stream.sample_aspect_ratio -ne '1:1' -or $stream.display_aspect_ratio -ne '9:16' -or $stream.avg_frame_rate -ne "$fps/1"){throw "Wrong square-pixel portrait format: $raw"}
            $checks+=@{requested=$requested;fps=$fps;stream=$stream}
          }}
          @{passed=$true;cases=$checks;scope='Four freshly encoded Windows app outputs; independent bundled ffprobe check. No real GPU available.'}|ConvertTo-Json -Depth 8|Tee-Object -FilePath (Join-Path $env:REPORT_ROOT 'pixel-aspect-acceptance.json')
      - name: Exercise signed update helper from 0.17.0 and observe restart
        if: ${{ !cancelled() && steps.runtime.outcome == 'success' }}
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $report=@{fromVersion='0.17.0';toVersion=$env:APP_VERSION;passed=$false;uiButtonAndNetworkFlowExercised=$false;limits='Actual old signed helper, parent shutdown, file replacement and restarted window on an ephemeral Windows VM. User PC, update-button path, network and antivirus are separate.'}
          $target=$null;$parent=$null;$runner=$null
          try {
            $base=Join-Path $env:RUNNER_TEMP 'KuzeliaUpdateRestart'
            New-Item -ItemType Directory -Path $base -Force|Out-Null
            $oldZip=Join-Path $base 'previous.zip'
            Invoke-WebRequest -Uri 'https://github.com/taisukek13-tech/KuzeliaStudio-Updates/releases/download/v0.17.0/KuzeliaStudio_Update_v0.17.0.zip' -OutFile $oldZip
            if((Get-FileHash $oldZip -Algorithm SHA256).Hash.ToLowerInvariant() -ne '1feec87b948b4ddfcc31d4405876ac05f84cc1ba41096d7bbbd927abf0fcb838'){throw 'Previous signed runtime ZIP differs'}
            Expand-Archive -LiteralPath $oldZip -DestinationPath (Join-Path $base 'previous')
            $target=Join-Path $base 'previous\KuzeliaStudio'
            $targetExe=Join-Path $target 'KuzeliaStudio.exe'
            $normal=Join-Path $env:LOCALAPPDATA 'KuzeliaStudio.Native'
            $stage=Join-Path $normal ('Updates\'+[Guid]::NewGuid().ToString('N'))
            $payload=Join-Path $stage 'payload';$helper=Join-Path $stage 'runner'
            New-Item -ItemType Directory -Path $payload,$helper -Force|Out-Null
            foreach($file in Get-ChildItem -LiteralPath $env:APP_ROOT){if($file.Name -ne 'update-release.json'){Copy-Item -LiteralPath $file.FullName -Destination $payload -Recurse}}
            Copy-Item -LiteralPath (Join-Path $env:APP_ROOT 'update-release.json') -Destination $stage
            foreach($file in Get-ChildItem -LiteralPath $target -File){if($file.Extension -in '.dll','.exe','.json'){Copy-Item -LiteralPath $file.FullName -Destination $helper}}
            [IO.File]::WriteAllText((Join-Path $target 'my-recording.mp4'),'UPDATE-SOURCE-KEEP')
            [IO.File]::WriteAllText((Join-Path $normal 'ci-update-user-data.txt'),'UPDATE-DATA-KEEP')
            $parent=Start-Process -FilePath $targetExe -WorkingDirectory $target -PassThru
            for($i=0;$i -lt 120;$i++){$parent.Refresh();if($parent.HasExited){throw 'Previous app exited before update'};if($parent.MainWindowHandle -ne 0){break};Start-Sleep -Milliseconds 500}
            if($parent.MainWindowHandle -eq 0){throw 'Previous app window did not open'}
            $job=Join-Path $stage 'job.json'
            @{target=$target;stage=$stage;parentId=$parent.Id;parentStartedTicks=$parent.StartTime.ToUniversalTime().Ticks;restartMode='home'}|ConvertTo-Json|Set-Content -LiteralPath $job -Encoding utf8NoBOM
            $runner=Start-Process -FilePath (Join-Path $helper 'KuzeliaStudio.exe') -WorkingDirectory $helper -ArgumentList ('--apply-update "'+$job+'"') -PassThru
            for($i=0;$i -lt 120 -and -not (Test-Path (Join-Path $stage 'ready'));$i++){if($runner.HasExited){throw 'Update helper exited before ready'};Start-Sleep -Milliseconds 500}
            if(-not (Test-Path (Join-Path $stage 'ready'))){throw 'Update helper did not become ready'}
            if(-not $parent.CloseMainWindow() -or -not $parent.WaitForExit(20000)){throw 'Previous app did not close normally'}
            $report.oldParentExited=$true
            if(-not $runner.WaitForExit(120000) -or $runner.ExitCode -ne 0){throw 'Update helper did not finish normally'}
            $report.helperExited=$true
            $restarted=$null
            for($i=0;$i -lt 120;$i++){
              $restarted=Get-Process -Name KuzeliaStudio -ErrorAction SilentlyContinue|Where-Object {$_.Path -eq $targetExe -and $_.Id -ne $parent.Id}|Select-Object -First 1
              if($null -ne $restarted){$restarted.Refresh();if($restarted.MainWindowHandle -ne 0){break}}
              Start-Sleep -Milliseconds 500
            }
            if($null -eq $restarted -or $restarted.MainWindowHandle -eq 0){throw 'Updated app window did not restart'}
            $report.restartedWindowPresent=$true
            if((Get-FileHash (Join-Path $target 'Kuzelia.Core.dll') -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:CORE_SHA){throw 'Restarted app has another Core'}
            $version=[Diagnostics.FileVersionInfo]::GetVersionInfo((Join-Path $target 'KuzeliaStudio.dll')).FileVersion
            if(-not $version.StartsWith($env:APP_VERSION+'.')){throw 'Restarted app version differs'}
            $report.restartedFileVersion=$version
            $envelope=Get-Content (Join-Path $target 'update-release.json') -Raw|ConvertFrom-Json
            $manifest=[Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($envelope.payload))|ConvertFrom-Json
            foreach($file in $manifest.files){if((Get-FileHash (Join-Path $target $file.path) -Algorithm SHA256).Hash.ToLowerInvariant() -ne $file.sha256){throw ('Updated inventory differs: '+$file.path)}}
            $report.signedFilesVerified=$manifest.files.Count
            if([IO.File]::ReadAllText((Join-Path $target 'my-recording.mp4')) -ne 'UPDATE-SOURCE-KEEP' -or [IO.File]::ReadAllText((Join-Path $normal 'ci-update-user-data.txt')) -ne 'UPDATE-DATA-KEEP'){throw 'Update changed user data'}
            $report.unownedAndUserDataPreserved=$true
            $pending=$null;$runOnce=[Microsoft.Win32.Registry]::CurrentUser.OpenSubKey('Software\Microsoft\Windows\CurrentVersion\RunOnce')
            try {if($null -ne $runOnce){$pending=$runOnce.GetValue('KuzeliaStudioUpdate',$null)}} finally {if($null -ne $runOnce){$runOnce.Dispose()}}
            if($null -ne $pending){throw 'Update recovery RunOnce was not cleared'}
            $report.recoveryRegistrationCleared=$true;$report.passed=$true
          } catch {$report.error=$_.Exception.Message;throw}
          finally {
            if($null -ne $target){foreach($process in Get-Process -Name KuzeliaStudio -ErrorAction SilentlyContinue){if($process.Path -eq (Join-Path $target 'KuzeliaStudio.exe')){if(-not $process.CloseMainWindow() -or -not $process.WaitForExit(10000)){Stop-Process -Id $process.Id -Force}}}}
            if($null -ne $runner -and -not $runner.HasExited){Stop-Process -Id $runner.Id -Force}
            $report|ConvertTo-Json -Depth 8|Tee-Object -FilePath (Join-Path $env:REPORT_ROOT 'update-restart-acceptance.json')
          }
      - name: Test new installation, repair and user-data preservation
        if: ${{ !cancelled() && steps.runtime.outcome == 'success' }}
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if($env:SETUP_SHA -notmatch '^[a-f0-9]{64}$'){throw 'Invalid setup SHA-256'}
          $setup=Join-Path $env:RUNNER_TEMP 'KuzeliaAcceptanceIncoming\KuzeliaStudio_Setup_v0.18.3.exe'
          if((Get-FileHash $setup -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:SETUP_SHA){throw 'Setup digest mismatch'}
          $target=Join-Path $env:RUNNER_TEMP 'KuzeliaInstallTest'
          $normal=Join-Path $env:LOCALAPPDATA 'KuzeliaStudio.Native'
          New-Item -ItemType Directory -Path $normal -Force|Out-Null
          $sentinel=Join-Path $normal 'ci-user-data.txt'
          [IO.File]::WriteAllText($sentinel,'USER-DATA-KEEP')
          function Install { $p=Start-Process -FilePath $setup -ArgumentList @('/S',('/D='+$target)) -PassThru -Wait;if($p.ExitCode -ne 0){throw 'Setup did not complete'} }
          Install
          [IO.File]::WriteAllText((Join-Path $target 'my-recording.mp4'),'SOURCE-KEEP')
          New-Item -ItemType Directory -Path (Join-Path $target 'my-fonts') -Force|Out-Null
          [IO.File]::WriteAllText((Join-Path $target 'my-fonts\custom.ttf'),'FONT-KEEP')
          Install
          $envelope=Get-Content (Join-Path $env:APP_ROOT 'update-release.json') -Raw|ConvertFrom-Json
          $manifest=[Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($envelope.payload))|ConvertFrom-Json
          foreach($file in $manifest.files){$path=Join-Path $target $file.path;if(-not (Test-Path $path) -or (Get-FileHash $path -Algorithm SHA256).Hash.ToLowerInvariant() -ne $file.sha256){throw ('Installed file differs: '+$file.path)}}
          $p=Start-Process -FilePath (Join-Path $target 'Uninstall.exe') -ArgumentList '/S' -PassThru -Wait
          for($i=0;$i -lt 40 -and (Test-Path (Join-Path $target 'KuzeliaStudio.exe'));$i++){Start-Sleep -Milliseconds 250}
          $preserved=([IO.File]::ReadAllText($sentinel) -eq 'USER-DATA-KEEP' -and [IO.File]::ReadAllText((Join-Path $target 'my-recording.mp4')) -eq 'SOURCE-KEEP' -and [IO.File]::ReadAllText((Join-Path $target 'my-fonts\custom.ttf')) -eq 'FONT-KEEP')
          $gone=-not (Test-Path (Join-Path $target 'KuzeliaStudio.exe'))
          @{installedInventoryVerified=$true;repairCompleted=$true;uninstallRemovedOwnedApp=$gone;sourceSettingsAndFontsPreserved=$preserved;limits='Ephemeral hosted Windows user, not antivirus or real in-app update/restart acceptance.'}|ConvertTo-Json|Tee-Object -FilePath (Join-Path $env:REPORT_ROOT 'installer-acceptance.json')
          if(-not $preserved -or -not $gone){throw 'Installer user-data preservation failed'}
      - name: Retain small acceptance reports and app-window captures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Kuzelia-Windows-Acceptance-${{ github.run_id }}
          path: ${{ runner.temp }}/KuzeliaAcceptanceReports
          retention-days: 1
          if-no-files-found: warn
