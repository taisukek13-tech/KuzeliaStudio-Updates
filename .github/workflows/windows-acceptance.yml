name: Windows acceptance
'on':
  push:
    branches:
    - validation-close-window-candidate-1
permissions:
  contents: read
jobs:
  window-return:
    name: Isolated duplicate and modal windows
    runs-on: windows-2025
    timeout-minutes: 8
    env:
      BUNDLE_SHA: 28380420cbd8a6c5a243fe7d967a299f7f4d1253750600bd69f27b2f4ff0d3ca
      BASE_DLL_SHA: fd05cc07833bd0a1ccf2bccaf0953b183bf4e46e788602f045930264df3d7ea3
      CANDIDATE_DLL_SHA: 0d72e554d7a63f36fae3cabc3e7ebbefce2088158780962b183312139f143bb3
      FULL_SHA: 249ac3ba16e1c8a64599e48c2a62df4146819d8843be41cd359a0fbdb7f6c64d
    steps:
    - name: Verify official build and apply the isolated Desktop difference on the
        runner
      shell: pwsh
      run: |-
        $ErrorActionPreference = 'Stop'
        $root = Join-Path $env:RUNNER_TEMP 'window-return-study'
        $kit = Join-Path $root 'kit'
        $report = Join-Path $root 'evidence'
        $null = New-Item $kit,$report -ItemType Directory -Force
        $zip = Join-Path $root 'stable.zip'
        $bundle = Join-Path $root 'test.zip'
        $release = 'https://github.com/taisukek13-tech/KuzeliaStudio-Updates/releases/download/v0.20.24/KuzeliaStudio_Update_v0.20.24.zip'
        $base = 'https://raw.githubusercontent.com/' + $env:GITHUB_REPOSITORY + '/' + $env:GITHUB_SHA + '/.github/workflows/window-return-study.zip'
        & curl.exe --fail --silent --show-error --location --retry 2 --max-time 240 --output $zip $release
        if ($LASTEXITCODE -ne 0 -or (Get-FileHash $zip).Hash -ne $env:FULL_SHA) { throw 'Unexpected official runtime' }
        & curl.exe --fail --silent --show-error --location --retry 2 --max-time 50 --output $bundle $base
        if ($LASTEXITCODE -ne 0 -or (Get-FileHash $bundle).Hash -ne $env:BUNDLE_SHA) { throw 'Unexpected test bundle' }
        [IO.Compression.ZipFile]::ExtractToDirectory($zip,(Join-Path $root 'runtime'))
        [IO.Compression.ZipFile]::ExtractToDirectory($bundle,$kit)
        $app = Join-Path $root 'runtime/KuzeliaStudio'
        $dll = Join-Path $app 'KuzeliaStudio.dll'
        if ((Get-FileHash $dll).Hash -ne $env:BASE_DLL_SHA) { throw 'Unexpected baseline Desktop DLL' }
        $delta = Join-Path $kit 'runtime-difference.patch'
        & git -C $app apply --binary --whitespace=nowarn $delta
        if ($LASTEXITCODE -ne 0 -or (Get-FileHash $dll).Hash -ne $env:CANDIDATE_DLL_SHA) { throw 'Isolated candidate differs from known local DLL' }
        $core = (Get-FileHash (Join-Path $app 'Kuzelia.Core.dll')).Hash
        if ($core -ne 'cbd04b705f7c7fbdddd7e38de28ef3a240590d8681825cae78f2ab6640e60cbe') { throw 'Unexpected runtime Core' }
        @{ officialZipSha256=$env:FULL_SHA; officialDesktopSha256=$env:BASE_DLL_SHA; candidateDesktopSha256=$env:CANDIDATE_DLL_SHA; gitBinaryPatchSha256=(Get-FileHash $delta).Hash; effectiveCoreSha256=$core; os=[Environment]::OSVersion.VersionString } | ConvertTo-Json | Set-Content (Join-Path $report 'provenance.json')
        "APP_ROOT=$app","REPORT_ROOT=$report","TEST_SCRIPT=$(Join-Path $kit 'test-window.ps1')" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
    - name: Open twice, respect active dialogs, restore the primary and exercise normal
        close
      shell: pwsh
      run: |-
        & powershell.exe -NoLogo -NoProfile -NonInteractive -STA -ExecutionPolicy Bypass -File $env:TEST_SCRIPT
        if ($LASTEXITCODE -ne 0) { throw 'Window acceptance did not pass' }
        if (!(Test-Path (Join-Path $env:REPORT_ROOT 'window-acceptance.json'))) { throw 'Window acceptance report missing' }
    - name: Save the window and process observations
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: Kuzelia-Window-Return-${{ github.run_id }}
        path: ${{ runner.temp }}/window-return-study/evidence/*.json
        if-no-files-found: warn
        retention-days: 3
